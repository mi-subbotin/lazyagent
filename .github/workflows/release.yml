name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GoReleaser needs to publish the GitHub Release

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser builds the changelog from git history

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope on mi-subbotin/homebrew-tap. Set in
          # Settings → Secrets and variables → Actions → New secret.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
